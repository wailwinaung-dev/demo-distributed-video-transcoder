version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lms_demo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: lms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web Console
    volumes:
      - minio_data:/data

  # Auto-creates S3 buckets on startup
  minio-provision:
    image: minio/mc:latest
    container_name: lms-minio-provision
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin); do
        sleep 1;
      done;
      /usr/bin/mc mb local/lms-raw-uploads --ignore-existing;
      /usr/bin/mc mb local/lms-stream-media --ignore-existing;
      /usr/bin/mc anonymous set download local/lms-stream-media;
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "

  companion:
    image: transloadit/companion:latest
    container_name: lms-companion
    restart: unless-stopped
    ports:
      - '3020:3020'
    environment:
      COMPANION_PORT: '3020'
      COMPANION_DOMAIN: 'localhost:3020'
      COMPANION_PROTOCOL: 'http'
      COMPANION_SECRET: 'lms-companion-secret-development-key-1234'
      COMPANION_DATADIR: '/tmp'
      COMPANION_CLIENT_SOCKET_CONNECT_TIMEOUT: '60000'
      COMPANION_CLIENT_ORIGINS: 'http://localhost:3000'
      COMPANION_REDIS_URL: 'redis://redis:6379'
      COMPANION_GOOGLE_KEY: ${COMPANION_GOOGLE_KEY:-}
      COMPANION_GOOGLE_SECRET: ${COMPANION_GOOGLE_SECRET:-}
      COMPANION_AWS_KEY: minioadmin
      COMPANION_AWS_SECRET: minioadmin
      COMPANION_AWS_BUCKET: lms-raw-uploads
      COMPANION_AWS_ENDPOINT: http://minio:9000
      COMPANION_AWS_REGION: us-east-1
      COMPANION_AWS_FORCE_PATH_STYLE: 'true'
      COMPANION_AWS_PREFIX: 'raw/'
    depends_on:
      - minio
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
